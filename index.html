<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="global.css">
  <title>Intégration-html-css</title>
</head>

<body>
  <!-- Début Entête de la page -->
  <Header>
    <section class="section-header">
      <div class="Box-titre-header">
        <h1>Header</h1>
      </div>
    </section>
  </Header>
  <!-- Fin Entête de la page -->

  <!-- Début Corps de la page -->
  <main>
    <section class="section-nav">
      <nav class="nav">
        <h1>Nav</h1>
      </nav>
    </section>

    <section class="section-hero">
      <div class="section-titres">
        <h1 class="Titre-principal">HERO SECTION</h1>
        <h2 class="Titre-secondaire">Titre de bienvenue</h2>
        <h3 class="Titre-tertiaire">Titre de bienvenue</h3>

        <button>Bouton</button>
      </div>

      <div class="Titre-services">
        <h1>Services</h1>
      </div>

      <section class="section-services">
        <div class="Box-1">
          <h1>Services 1</h1>
        </div>

        <div class="Box-2">
          <h1>Services 2</h1>
        </div>

        <div class="Box-3">
          <h1>Services 3</h1>
        </div>
      </section>
    </section>
  </main>
  <!-- Fin Corps de la page -->

  <!-- Début Pied de la page -->
  <footer>
    <section class="section-footer">
      <div class="section-info">
        <h1>SECTION INFO</h1>
      </div>

      <div class="section-pied-page">
        <h1>FOOTER</h1>
      </div>
    </section>
  </footer>
  <!-- Fin Pied de la page -->

</body>

</html>
